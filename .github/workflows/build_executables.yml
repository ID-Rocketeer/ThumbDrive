name: Build Portable Executables

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            output_name: server_win.exe
            sep: ';'
          - os: ubuntu-latest
            output_name: server_linux
            sep: ':'
          - os: macos-latest
            output_name: server_mac
            sep: ':'

    steps:
      - name: Checkout ThumbDrive Repository
        uses: actions/checkout@v4
        with:
          path: ThumbDrive

      - name: Checkout Sister Repository PaperHanger
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PaperHanger
          path: PaperHanger
          token: ${{ secrets.EXTRA_REPOS_PAT }}
        continue-on-error: true

      - name: Checkout Sister Repository Halloween
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Halloween
          path: Halloween
          token: ${{ secrets.EXTRA_REPOS_PAT }}
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow watchdog

      - name: Build Standalone Binary with PyInstaller
        run: |
          cd ThumbDrive
          pyinstaller --onefile --name ${{ matrix.output_name }} --paths ../PaperHanger --paths ../Halloween --add-data "../Halloween/static${{ matrix.sep }}static" thumbdrive_runner.py
        shell: bash

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ThumbDrive/dist/${{ matrix.output_name }}
